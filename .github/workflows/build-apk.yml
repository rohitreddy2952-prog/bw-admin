name: Build Admin APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          echo '<!doctype html><html><body>BW Admin</body></html>' > www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: |
          pip install --break-system-packages pillow || pip install pillow
          python3 - <<'PY'
          import glob, os, shutil
          from PIL import Image, ImageDraw
          os.makedirs("assets", exist_ok=True)
          found = [f for f in glob.glob("logo*") + glob.glob("icon-only*") if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))]
          if found:
              src = Image.open(found[0]).convert("RGB")
              S = 1024
              src.resize((S, S), Image.LANCZOS).save("assets/icon-only.png")
              w, h = src.size; side = min(w, h)
              sq = src.crop(((w - side) // 2, (h - side) // 2, (w - side) // 2 + side, (h - side) // 2 + side))
              m = Image.new("L", (side * 2, side * 2), 0)
              ImageDraw.Draw(m).ellipse((int(side * .024), int(side * .024), int(side * 1.976), int(side * 1.976)), fill=255)
              m = m.resize((side, side), Image.LANCZOS)
              D = 660
              e = sq.resize((D, D), Image.LANCZOS).convert("RGBA")
              e.putalpha(m.resize((D, D), Image.LANCZOS))
              fg = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              fg.paste(e, ((S - D) // 2, (S - D) // 2), e)
              fg.save("assets/icon-foreground.png")
              Image.new("RGB", (S, S), "#000000").save("assets/icon-background.png")
              print("icons made from", found[0])
          else:
              raise SystemExit("Logo file nahi mila: logo.png ya icon-only.png upload karo")
          PY
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BW-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
